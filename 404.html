<!doctype html>
<html lang="en" data-page="404">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Page not found · Jason Tsoukalas</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#f2f0eb" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0b0e12" media="(prefers-color-scheme: dark)">
  <meta name="color-scheme" content="light dark">
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
  <script>
    (function () {
      try {
        var t = localStorage.getItem("theme");
        if (t === "light" || t === "dark") document.documentElement.dataset.theme = t;
      } catch (e) {}
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,300..600;1,6..72,300..500&display=swap">
  <!-- Absolute paths: GitHub Pages serves this file for any missing URL, at any depth -->
  <link rel="stylesheet" href="/assets/css/site.css">
  <!-- .card a draws its underline as a background, which would wipe the button fill -->
  <style>.lost .card a.btn--solid { background: var(--ink); color: var(--bg); }</style>
  <script src="/assets/js/visits.js" defer></script>
</head>
<body>
  <div class="field" aria-hidden="true"><i class="o1"></i><i class="o2"></i><i class="o3"></i><i class="o4"></i></div>
  <div class="grain" aria-hidden="true"></div>

  <main class="lost">
    <div class="card glass glass--float">
      <span class="section__num">404</span>
      <h1>This page isn't here.</h1>
      <p>The address may be wrong, or the page has moved.</p>
      <a class="btn btn--solid" href="/">Go to the homepage</a>
    </div>
  </main>
</body>
</html>
