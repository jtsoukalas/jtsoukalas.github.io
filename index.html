<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jason Tsoukalas</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        body{
            font-family:'Poppins',sans-serif;
            height:100vh;
            overflow:hidden;
            color:white;

            background:
                radial-gradient(circle at 15% 25%, rgba(255,255,255,.45), transparent 30%),
                radial-gradient(circle at 80% 20%, rgba(20,120,255,.35), transparent 35%),
                radial-gradient(circle at 35% 85%, rgba(120,170,255,.25), transparent 30%),
                linear-gradient(135deg,#0d3fae,#1b64ff,#0b2f8d);
        }

        /* subtle noise */
        body::after{
            content:"";
            position:fixed;
            inset:0;
            background-image:
                radial-gradient(rgba(255,255,255,.06) 1px, transparent 1px);
            background-size:5px 5px;
            opacity:.18;
            pointer-events:none;
        }

        .container{
            max-width:1200px;
            margin:auto;
            height:100%;
            display:flex;
            flex-direction:column;
            justify-content:center;
            align-items:center;
            padding:40px;
        }

        .hero{
            width:100%;
            max-width:980px;
            display:grid;
            grid-template-columns:1fr 260px;
            overflow:hidden;

            background:rgba(18,20,27,.92);

            border-radius:20px;

            backdrop-filter:blur(12px);

            box-shadow:
                0 25px 60px rgba(0,0,0,.45);
        }

        .hero-left{
            display:flex;
            align-items:center;
            justify-content:center;
            min-height:180px;
        }

        .hero-left h1{
            font-size:4rem;
            font-weight:700;
            letter-spacing:-2px;
        }

        .hero-right{
            border-left:1px solid rgba(255,255,255,.08);
            display:flex;
            flex-direction:column;
            justify-content:center;
            padding-left:35px;
        }

        .hero-right h3{
            font-size:2rem;
            margin-bottom:6px;
        }

        .hero-right p{
            font-size:1.8rem;
            font-weight:300;
            opacity:.95;
        }

        .content{
            margin-top:90px;
            text-align:center;
        }

        .content i{
            font-size:5rem;
            opacity:.7;
            margin-bottom:30px;
        }

        .content h2{
            font-size:4rem;
            margin-bottom:18px;
            letter-spacing:-1px;
        }

        .content p{
            color:rgba(255,255,255,.82);
            font-size:1.5rem;
            line-height:1.7;
        }

        .divider{
            width:80px;
            height:3px;
            background:#59b5ff;
            margin:45px auto;
            border-radius:10px;
        }

        footer{
            color:rgba(255,255,255,.65);
            font-size:1rem;
        }

        @media(max-width:900px){

            body{
                overflow:auto;
            }

            .container{
                padding:20px;
            }

            .hero{
                grid-template-columns:1fr;
            }

            .hero-left{
                min-height:140px;
                padding:20px;
            }

            .hero-left h1{
                font-size:2.6rem;
                text-align:center;
            }

            .hero-right{
                border-left:none;
                border-top:1px solid rgba(255,255,255,.08);
                padding:30px;
                text-align:center;
            }

            .hero-right h3{
                font-size:1.6rem;
            }

            .hero-right p{
                font-size:1.3rem;
            }

            .content{
                margin-top:60px;
            }

            .content h2{
                font-size:2.4rem;
            }

            .content p{
                font-size:1.1rem;
            }
        }
    </style>
</head>
<body>

<div class="container">

    <div class="hero">

        <div class="hero-left">
            <h1>Jason Tsoukalas</h1>
        </div>

        <div class="hero-right">
            <h3>Hello</h3>
            <p>Let's Connect</p>
        </div>

    </div>

    <section class="content">

        <i class="fa-solid fa-person-digging"></i>

        <h2>Site Under Construction</h2>

        <p>
            I'm working behind the scenes.<br>
            Please check back soon!
        </p>

        <div class="divider"></div>

        <footer>
            © 2026 Jason Tsoukalas. All rights reserved.
        </footer>

    </section>

</div>

</body>
</html>
